name: Défaut de spécification ou de validation
description: Décrire une incohérence avec un exemple entièrement fictif.
title: '[Défaut] '
body:
  - type: input
    id: version
    attributes:
      label: Version SGAN et système utilisé
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Comportement observé et étapes de reproduction
      description: Utiliser exclusivement des données fictives.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu et règle concernée
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Confidentialité
      options:
        - label: Aucun arbre réel ni donnée personnelle privée n’est joint.
          required: true
