name: Conformite SGAN
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python tools/generate_schemas.py --check
      - run: python tools/profile_v031.py --check
      - run: python tools/validate.py examples/minimal/Classement
      - run: python tools/validate.py examples/documente/Classement
      - run: python tools/validate_v031.py examples/v0.3.1/Paquet
      - run: python -m unittest discover -s tests -v
